<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nikhil</title>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // Your existing Public Key
            emailjs.init({
                publicKey: "6AVfZ9u-g6sgIOxAG"
            });
        })();
    </script>

    <style>
        :root {
            --bg: #0d0d0d; 
            --accent: #d4af37; 
            --card-bg: #161616; 
            --text: #ffffff;
            --muted: #b3b3b3;
            --success: #28a745;
            --error: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .form-box {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent);
            font-size: 28px;
            font-weight: 700;
        }

        .status-msg {
            display: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        .status-msg.success {
            display: block;
            background: rgba(40, 167, 69, 0.15);
            color: #4ade80;
            border: 1px solid var(--success);
        }

        .status-msg.error {
            display: block;
            background: rgba(220, 53, 69, 0.15);
            color: #f87171;
            border: 1px solid var(--error);
        }

        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input,
        .input-box textarea {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1.5px solid #444;
            outline: none;
            border-radius: 8px;
            font-size: 15px;
            color: var(--text);
            transition: border-color 0.3s ease;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 12px;
            color: var(--muted);
            font-size: 15px;
            pointer-events: none;
            transform: translateY(-50%);
            transition: all 0.25s ease;
            padding: 0 5px;
        }

        /* Floating label transition on focus or non-empty value */
        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label,
        .input-box textarea:focus ~ label,
        .input-box textarea:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 12px;
            color: var(--accent);
            background: var(--card-bg);
        }

        .input-box input:focus,
        .input-box textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: none;
            height: 110px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: #666;
            color: #aaa;
        }

      .back-home {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap: 8px;

            width:
                fit-content;

            margin:
                55px auto 0;

            padding:
                12px 22px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius:
                30px;

            color:
                var(--muted);

            text-decoration:
                none;

            font-size:
                13px;

            transition:
                0.3s ease;
        }


        .back-home:hover {

            color:
                var(--accent);

            border-color:
                var(--accent);

            transform:
                translateX(-4px);
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Contact me</h2>

    <!-- Dynamic Status Banner -->
    <div id="statusMessage" class="status-msg"></div>

    <form id="contactForm">
        <div class="input-box">
            <!-- placeholder=" " is required for CSS floating label selector -->
            <input type="text" id="name" name="name" pattern="[A-Za-z ]+" placeholder=" " required>
            <label for="name">Name</label>
        </div>

        <div class="input-box">
            <input type="email" id="email" name="email" placeholder=" " required>
            <label for="email">Email ID</label>
        </div>

        <div class="input-box">
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder=" " required>
            <label for="phone">Phone Number (10 Digits)</label>
        </div>

        <div class="input-box">
            <textarea id="message" name="message" minlength="10" placeholder=" " required></textarea>
            <label for="message">Message</label>
        </div>

        <button type="submit" id="submitBtn">Send Message</button>
    </form>

    <a href="index.html" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

      ⬅ Back to Portfolio

    </a>
</div>

<script>
    const form = document.getElementById("contactForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMessage");

    form.addEventListener("submit", function(event) {
        // 1. Prevent default browser form refresh
        event.preventDefault();

        // 2. Visual feedback (loading state)
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        statusMsg.className = "status-msg";
        statusMsg.style.display = "none";

        // 3. Prepare parameters matching EmailJS template tags
        const templateParams = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            message: document.getElementById("message").value.trim()
        };

        // -------------------------------------------------------------
        // IMPORTANT: Replace these two placeholders with your actual IDs
        // Found at: https://dashboard.emailjs.com/admin
        // -------------------------------------------------------------
        const SERVICE_ID = "service_b5rwlnn";     // e.g., "service_abc123"
        const TEMPLATE_ID = "template_nx3ni6h";   // e.g., "template_xyz789"

        emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
            .then(function(response) {
                console.log("SUCCESS!", response.status, response.text);
                statusMsg.innerText = "✓ Thank you! Your message has been sent.";
                statusMsg.className = "status-msg success";
                form.reset();
            })
            .catch(function(error) {
                console.error("FAILED...", error);
                statusMsg.innerText = "✕ Could not send message. Please try again later.";
                statusMsg.className = "status-msg error";
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            });
    });
</script>

</body>
</html>
